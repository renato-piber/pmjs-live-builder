# Configuracao central do PMJS Live Builder.
# Use codinomes Debian (por exemplo, trixie), nunca aliases moveis como stable.
LIVE_NAME="pmjs-live"
LIVE_VERSION="0.1.2"
LIVE_ARCH="amd64"

LIVE_USER="usuario"
LIVE_HOSTNAME="pmjs-live"
LIVE_LOCALE="pt_BR.UTF-8"
LIVE_KEYBOARD_LAYOUT="br"

DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="https://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="https://security.debian.org/debian-security"
ARCHIVE_AREAS="main non-free-firmware"

OUTPUT_DIR="./output"
WORK_DIR="./work"
LOG_DIR="./logs"
CACHE_DIR="./cache"

# Cache nativo do live-build. Indices APT nao sao persistidos, garantindo que
# cada build consulte metadados atuais e valide normalmente os pacotes .deb.
CACHE_ENABLED="true"
CACHE_PACKAGES="true"
CACHE_INDICES="false"
# O build normal pode reutilizar o bootstrap. --clean remove esse snapshot,
# preservando somente os downloads de pacotes para o build seguinte.
CACHE_STAGES="bootstrap"

# Uma imagem grafica requer folga para chroot, caches e ISO final.
MIN_FREE_GIB="20"
