# Informações do projeto
PROJECT_NAME="PMJS Deploy"

# Ambiente de execução: development ou production
PMJS_ENVIRONMENT="${PMJS_ENVIRONMENT:-production}"

# Uso interno explicito para testes/desenvolvimento; nao ha seletor na UI.
PMJS_DEPLOY_EXECUTION_MODE="${PMJS_DEPLOY_EXECUTION_MODE:-real}"

# Servidor principal de imagens
NFS_SERVER="192.168.0.19"
NFS_EXPORT="/var/clone-pmjs"
NFS_MOUNT="/mnt/clone-pmjs"

# Pasta local de imagens para uso em casa
LOCAL_IMAGES_DIR="$PROJECT_ROOT/pmjs-images"

# Mídia offline externa. O Deploy descobre a partição USB com LABEL=Ventoy,
# monta-a somente leitura quando necessário e procura este subdiretório.
OFFLINE_MOUNTPOINT="/mnt/pmjs-offline"
OFFLINE_IMAGES_SUBDIR="pmjs-images"
OFFLINE_VOLUME_LABEL="Ventoy"
OFFLINE_ALLOWED_FSTYPES="exfat"

# Fallback legado opcional para um diretório já conhecido. Vazio por padrão:
# produção não depende de imagens armazenadas dentro do projeto em /opt/pmjs.
OFFLINE_IMAGES_DIR=""

# Padrões da instalação
TARGET_USER="usuario"
DEFAULT_SWAP_SIZE="2G"
DEFAULT_ROOT_SIZE="30G"
MIN_DISK_SIZE_GIB=40
STORAGE_EFI_SIZE_MIN_BYTES=$((512 * 1024 * 1024))
STORAGE_EFI_SIZE_TOLERANCE_BYTES=$((64 * 1024 * 1024))
STORAGE_SWAP_SIZE_MIN_BYTES=$((2 * 1024 * 1024 * 1024))
STORAGE_SWAP_SIZE_TOLERANCE_BYTES=$((256 * 1024 * 1024))
STORAGE_ROOT_SIZE_MIN_BYTES=$((30 * 1024 * 1024 * 1024))
STORAGE_ROOT_SIZE_TOLERANCE_BYTES=$((2 * 1024 * 1024 * 1024))

# OCS Inventory
OCS_CONFIG="/etc/ocsinventory/ocsinventory-agent.cfg"

# Pós-instalação
POSTINSTALL_APT_TIMEOUT=120

# Tempo máximo para testar o servidor
NETWORK_TIMEOUT=3

# ETA global aproximada: somente instalações reais concluídas alimentam o
# histórico. Na Live este caminho é volátil; configure um diretório persistente
# gravável para conservar referências entre boots (não o volume offline ro).
ETA_HISTORY_ENABLED=1
ETA_HISTORY_FILE="${ETA_HISTORY_FILE:-/var/lib/pmjs-deploy/eta-history.json}"

# Validacao de particoes
PARTITIONS_DRY_RUN=1

# Montagem segura das particoes
INSTALL_TARGET_MOUNT="/mnt/pmjs-target"
