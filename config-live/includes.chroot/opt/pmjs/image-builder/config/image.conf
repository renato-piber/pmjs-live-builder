IMAGE_NAME="pmjs-linux"
# Versão do artefato produzido. É independente da versão do Builder em VERSION.
IMAGE_VERSION="0.2.0"

# Staging e saída final locais. Não aponte esta variável para Ventoy, NFS,
# exFAT ou outro filesystem remoto/não Linux; use --ventoy-dir, --nfs-dir ou
# publish-image.sh explicitamente.
OUTPUT_DIR="/var/tmp/pmjs-image-builder/output"
LOG_DIR="/var/tmp/pmjs-image-builder/logs"

# Automount padrão. --nfs-dir DIRETÓRIO tem precedência e não gerencia mounts.
NFS_ENABLED=1
NFS_SERVER="192.168.0.19"
NFS_EXPORT="/var/clone-pmjs"
NFS_MOUNTPOINT="/mnt/clone-pmjs"

# Margem adicional exigida ao copiar uma imagem concluída para o Ventoy.
VENTOY_FREE_SPACE_MARGIN_MIB=64

# Compatibilidade: destino já montado, usado quando NFS_ENABLED=0 ou ausente
# e --nfs-dir não foi informado. Vazio seleciona OUTPUT_DIR local nesse modo.
NFS_IMAGES_DIR=""

# Somente o perfil filtrado da home e o pequeno overlay de generalização usam
# espaço local. O reserve cobre logs e arquivos auxiliares pequenos.
LOCAL_TEMP_DIR="/var/tmp/pmjs-image-builder/staging"
LOCAL_TEMP_RESERVE_MIB=64

ROOTFS_FILENAME="auto"
HOMEFS_FILENAME="auto"

SOURCE_ROOT="auto"
HOME_SOURCE="auto"
HOME_USER="usuario"

# O contrato PMJS schema 1 publicado usa Zstandard obrigatoriamente.
IMAGE_COMPRESSION="zstd"
ZSTD_LEVEL=3

# Espaço mínimo no destino dos archives (OUTPUT_DIR, NFS ou Ventoy explícito).
MIN_FREE_SPACE_GIB=8
HOMEFS_MAX_SIZE_MIB=512
